description: 'Internet Security Systems (ISS) was an Atlanta-based network and internet security
  company, founded in 1994, that provided vulnerability scanning, intrusion detection, and managed
  security services (Internet Scanner, RealSecure, Proventia, BlackICE). It was acquired by IBM in
  2006 for approximately $1.3 billion and folded into IBM as IBM Internet Security Systems (later IBM
  Security / X-Force); it no longer exists as an independent company. Surfaced as a portfolio company
  of kleiner-perkins and added to the API Evangelist network as a stub, ISS operates no active,
  independent public developer or API surface today, so there is nothing live to enrich against.'
